modLoader="javafml"
loaderVersion="[47,)"
license="GPL-3.0"
[[mods]]
modId="${mod_id}"
version="${version}"
displayName="${mod_name}"
authors="闲肆"
description='''A Forge 1.20.1 reimplementation foundation for Modular Machinery: Community Edition, with data-driven machines and KubeJS recipes.'''
[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="[47,)"
    ordering="NONE"
    side="BOTH"
[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="[1.20.1,1.21)"
    ordering="NONE"
    side="BOTH"
# 波 5.2：两个**可选**依赖，声明在这里是为了让「本模组与它们的关系」有一处可读的地方。
#
# 这两行**不产生新行为**，写清楚免得被当成「已经接好了」：
#   - kubejs：本模组与它的结合一直走 kubejs.plugins.txt（KubeJS 自己的入口文件），与这份声明无关。
#   - jei：本模组一直走 META-INF/services/mezz.jei.api.IModPlugin（ServiceLoader），也与它无关。
# 也就是说，这两行只是把既有的软关系**登记**下来。
#
# ⚠️ **versionRange 不能省。** 0.34.0 实机报告第一行就是这件事：
#     `[ModSorter/LOADING]: Unsupported installed optional dependencies: Mod ID: 'kubejs', …
#      Expected range: '', Actual version: '2001.6.5-build.26'`
# 三个都装了、三个都报。**省略 versionRange 会被 Forge 解析成空范围，而空范围不匹配任何版本**——
# 于是「可选」在装了那个模组的玩家身上变成了一条错误（Forge 只对**装了的**可选依赖做这个判断，
# 所以「没装时不报」并不说明写法没问题；我最初就是拿 Botania 的 gardenofglass 当反例，
# 差点得出错误结论——那一条没装，所以它从来没被检查过）。
#
# 下界宽度按生态既有写法取：JEI 那一侧几乎一律是 `[15,)`（`almostunified` 用 `[15.1.0.18,)`），
# Minecolonies 用 `[1,)`。这里统一用 `[1,)`：对本模组而言「任何真实版本都可以」，
# 而把玩家挡在门外的风险最小。
[[dependencies.${mod_id}]]
    modId="jei"
    mandatory=false
    versionRange="[1,)"
    ordering="NONE"
    side="BOTH"
[[dependencies.${mod_id}]]
    modId="kubejs"
    mandatory=false
    versionRange="[1,)"
    ordering="NONE"
    side="BOTH"
# 0.50.0：Jade。本模组现在自带一个 Jade 插件（`integration/jade`），把流体仓的内容直接交给 Jade 显示。
#
# 为什么从「不声明」变成「声明」：那个插件要 `@WailaPlugin` 被 Jade 扫描到才生效，而扫描是 Jade 做的
# ——声明它只是让「有这个可选集成」这件事在元数据里可见，`mandatory=false` 表示没装 Jade 的实例
# 照常启动（那时插件类不会被任何人引用，也就不会被加载）。
#
# `ordering="AFTER"`：插件要引用 Jade 的 API 类型，让 FML 保证 Jade 先构造。
[[dependencies.${mod_id}]]
    modId="jade"
    mandatory=false
    versionRange="[1,)"
    ordering="AFTER"
    side="BOTH"
# 波 5.3：Mekanism 的化学（旧版的「气体」）是本模组第一个真兼容模块。
#
# 这条声明**是有实质作用的，不是登记**，与上面两条不同：气体端口要把本模组的流体仓暴露成 Mekanism 的
# `IChemicalHandler`，而能力对象必须在**读取时**已经就绪。`ordering="AFTER"` 让 FML 保证
# Mekanism 先构造。
#
# mandatory=false：没装 Mekanism 的进程照常启动，只是没有气体端口（`compat/` 的设计就是如此）。
[[dependencies.${mod_id}]]
    modId="mekanism"
    mandatory=false
    versionRange="[1,)"
    ordering="AFTER"
    side="BOTH"
# 0.70.0（C7）：GeckoLib。控制器的自定义模型/动画可选地由它渲染。
#
# 与 kubejs/jei 那两条不同，这条有实质作用：MachineControllerGeoRenderer 编译时引用 GeckoLib 的
# GeoObjectRenderer。没有它时 ClientSetup 不注册渲染器，模组照常启动（机器用普通方块模型）。
# ordering=AFTER：渲染器要引用 GeckoLib 的类型，先让它构造。
[[dependencies.${mod_id}]]
    modId="geckolib"
    mandatory=false
    versionRange="[4,)"
    ordering="AFTER"
    side="BOTH"
# 0.73.0（C4）：AE2。ME 物品输入/输出总线是第一个需要 AE2 类型（节点、MEStorage）的集成。
#
# mandatory=false：没装 AE2 时两个方块不注册，模组照常启动；HatchKind 里仍保留这两个常量，
# 但没有任何代码会去解析 appeng 类型（方块实体类只在 AE2 存在时才被实例化）。
# ordering=AFTER：方块实体的字段/方法签名引用 AE2 API，让 FML 保证 AE2 先构造。
[[dependencies.${mod_id}]]
    modId="ae2"
    mandatory=false
    versionRange="[15,)"
    ordering="AFTER"
    side="BOTH"

